name: 🌍 Spatial Drift — Daily Alert

on:
  # ── Runs 4 times daily (IST = UTC+5:30) ──────────────────────────────────
  #   08:00 AM IST → 02:30 UTC
  #   12:00 PM IST → 06:30 UTC
  #   04:00 PM IST → 10:30 UTC
  #   10:00 PM IST → 16:30 UTC
  schedule:
    - cron: "30 2  * * *"   # 08:00 AM IST
    - cron: "30 6  * * *"   # 12:00 PM IST
    - cron: "30 10 * * *"   # 04:00 PM IST
    - cron: "30 16 * * *"   # 10:00 PM IST

  # ── Manual trigger from GitHub Actions tab ────────────────────────────────
  workflow_dispatch:

jobs:
  send-geospatial-brief:
    name: Fetch & Deliver Daily Brief
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🌍 Run Spatial Drift Alert
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python spatial_drift_alert.py
